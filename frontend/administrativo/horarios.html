<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<title>Consulta General</title>

<link rel="stylesheet" href="../css/styles.css">

</head>


<body>


<h1>🏢 Consulta General</h1>


<div id="horarios-container">
Cargando...
</div>



<script src="../js/api.js"></script>


<script>


async function cargar(){


const data =
await getHorarioGeneral();



const contenedor =
document.getElementById(
"horarios-container"
);



contenedor.innerHTML="";



data.horarios.forEach(dia=>{


contenedor.innerHTML += `

<h2>${dia.dia}</h2>


${dia.clases.map(c=>`

<div class="card">

<b>${c.hora}</b>

<p>${c.materia}</p>

<p>Grupo: ${c.grupo}</p>

<p>Docente: ${c.docente}</p>

<p>Aula: ${c.aula}</p>


</div>


`).join("")}


`;

});


}



cargar();


</script>


</body>

</html>
